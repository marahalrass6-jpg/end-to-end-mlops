services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MODEL_DIR: /service/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
